# Copy to .github/workflows/publish.yml. Tag-based npm publish: push a tag like v1.2.3 to release.
# One-time setup: npmjs.com > package > Settings > Trusted Publisher > GitHub Actions: owner, repo,
# workflow file "publish.yml", environment "npm-publish". Create that environment with required reviewers.
# Needs npm CLI >= 11.5.1 and Node >= 22.14 (Node 24 below). No NPM_TOKEN. Provenance is automatic for public repos.
# package.json must have a repository.url that matches the GitHub repo exactly.
name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$version"
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP/pack" && mv "$RUNNER_TEMP/pack" ./pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: pack
      - name: Publish the verified tarball
        run: npm publish ./pack/*.tgz --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes
